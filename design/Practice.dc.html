<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #0B7A4B; text-decoration: none; } a:hover { color: #085B38; }
    .num { font-family: "Space Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F4EF; color: #10161A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- bar -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 14px 13px; background: #FFFFFF; border-bottom: 1px solid #E3DFD6;">
    <span style="display: flex; width: 38px; height: 38px; border-radius: 11px; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5" stroke="#10161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; align-items: center;">
      <span class="num" style="font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;">Ibyapa</span>
      <span class="num" style="font-size: 11.5px; color: #8D9AA2;">6 / 180</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; min-width: 38px; justify-content: flex-end;">
      <span class="num" style="font-size: 14.5px; font-weight: 700; color: #0B7A4B;">4</span>
      <span style="width: 1px; height: 13px; background: #E3DFD6;"></span>
      <span class="num" style="font-size: 14.5px; font-weight: 700; color: #B8302B;">1</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 18px 20px 0; display: flex; flex-direction: column;">

    <p style="margin: 0; font-size: 17.5px; font-weight: 650; line-height: 1.42; letter-spacing: -0.008em; text-wrap: pretty;">Iki cyapa gisobanura iki?</p>

    <div style="display: flex; justify-content: center; margin: 13px 0 2px;">
      <img src="sign-slippery.png" alt="Icyapa cy'umuhanda" style="display: block; height: 104px; width: auto; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 14px; padding: 9px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 13px;">

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #E3DFD6; border-radius: 14px; padding: 12px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 29px; height: 29px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1.5px solid #E3DFD6; color: #5C6A72; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">A</span>
        <span style="font-size: 14.5px; line-height: 1.35; flex-grow: 1;">Umuhanda ufunganye</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FAEAE8; border: 1.5px solid #B8302B; border-radius: 14px; padding: 12px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 29px; height: 29px; flex: none; border-radius: 50%; background: #B8302B; border: 1.5px solid #B8302B; color: #FFFFFF; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">B</span>
        <span style="font-size: 14.5px; line-height: 1.35; flex-grow: 1;">Ahantu hakunze kubaho impanuka</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none;">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#B8302B" stroke-width="2.4" stroke-linecap="round"></path>
        </svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #E9F4EE; border: 1.5px solid #0B7A4B; border-radius: 14px; padding: 12px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 29px; height: 29px; flex: none; border-radius: 50%; background: #0B7A4B; border: 1.5px solid #0B7A4B; color: #FFFFFF; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">C</span>
        <span style="font-size: 14.5px; line-height: 1.35; flex-grow: 1; font-weight: 600;">Umuhanda unyerera</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none;">
          <path d="m5 12.6 4.4 4.4L19 7.4" stroke="#0B7A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #E3DFD6; border-radius: 14px; padding: 12px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 29px; height: 29px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1.5px solid #E3DFD6; color: #5C6A72; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">D</span>
        <span style="font-size: 14.5px; line-height: 1.35; flex-grow: 1;">Nta gisubizo cy'ukuri kirimo</span>
      </div>

    </div>

    <!-- feedback -->
    <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; background: #FAEAE8; border: 1px solid #F0CFCC; border-radius: 13px; padding: 13px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px;">
        <circle cx="12" cy="12" r="9" stroke="#B8302B" stroke-width="2"></circle>
        <path d="M12 7.6v5" stroke="#B8302B" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="12" cy="16" r="1.1" fill="#B8302B"></circle>
      </svg>
      <span style="font-size: 13.5px; line-height: 1.48; color: #8E241F;"><b>Sibyo.</b> Igisubizo nyacyo ni <b>C</b> — iki cyapa kiburira ko umuhanda unyerera.</span>
    </div>

    <span style="margin-top: 13px; font-size: 11.5px; color: #A8B2B8;">Igitabo — urupapuro 104</span>

  </div>

  <!-- footer -->
  <div style="display: flex; gap: 9px; padding: 10px 16px 20px; background: #FFFFFF; border-top: 1px solid #E3DFD6;">
    <span style="display: flex; flex-grow: 1; min-height: 48px; align-items: center; justify-content: center; border: 1px solid #E3DFD6; border-radius: 13px; font-size: 14px; font-weight: 600;">Inyuma</span>
    <span class="num" style="display: flex; flex-grow: 2; min-height: 48px; align-items: center; justify-content: center; gap: 6px; background: #0B7A4B; border-radius: 13px; font-size: 14.5px; font-weight: 700; color: #FFFFFF;">
      Komeza
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h13M12.5 6l6 6-6 6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
  </div>

</div>
</x-dc>
</body>
</html>
