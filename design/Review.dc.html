<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #0B7A4B; text-decoration: none; } a:hover { color: #085B38; }
    .num { font-family: "Space Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .badge { font-size: 10.5px; font-weight: 700; padding: 4px 8px; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
    .opt { display: flex; align-items: center; gap: 11px; border-radius: 12px; padding: 11px 13px; font-size: 14px; line-height: 1.35; }
    .ltr { display: flex; width: 27px; height: 27px; flex: none; border-radius: 50%; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; font-family: "Space Grotesk", system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F4EF; color: #10161A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- bar -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 14px 13px; background: #FFFFFF; border-bottom: 1px solid #E3DFD6;">
    <span style="display: flex; width: 38px; height: 38px; border-radius: 11px; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5" stroke="#10161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
    <span class="num" style="font-size: 15.5px; font-weight: 700; flex-grow: 1; text-align: center; letter-spacing: -0.01em;">Gusubiramo</span>
    <span class="num" style="min-width: 38px; text-align: right; font-size: 13px; font-weight: 700; color: #0B7A4B;">16/20</span>
  </div>

  <div style="flex-grow: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px;">

    <!-- wrong item -->
    <div style="background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 16px; padding: 15px 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge" style="background: #EDEAE2; color: #5C6A72;">Ikibazo 3</span>
        <span class="badge" style="background: #FAEAE8; color: #B8302B;">Sibyo</span>
        <span style="margin-left: auto; font-size: 11px; color: #A8B2B8;">ur. 92</span>
      </div>
      <p style="margin: 11px 0 12px; font-size: 15px; font-weight: 650; line-height: 1.4; text-wrap: pretty;">Ni ryari ushobora kunyuranaho iburyo?</p>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span class="opt" style="background: #FAEAE8; border: 1.5px solid #B8302B;">
          <span class="ltr" style="background: #B8302B; color: #FFFFFF;">A</span>
          <span style="flex-grow: 1;">Igihe cyose</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#B8302B" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </span>
        <span class="opt" style="background: #E9F4EE; border: 1.5px solid #0B7A4B;">
          <span class="ltr" style="background: #0B7A4B; color: #FFFFFF;">C</span>
          <span style="flex-grow: 1; font-weight: 600;">Iyo unyura ku nyamaswa</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.6 4.4 4.4L19 7.4" stroke="#0B7A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
      </div>
    </div>

    <!-- correct item -->
    <div style="background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 16px; padding: 15px 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge" style="background: #EDEAE2; color: #5C6A72;">Ikibazo 4</span>
        <span class="badge" style="background: #E4F1EA; color: #0B7A4B;">Nibyo</span>
        <span style="margin-left: auto; font-size: 11px; color: #A8B2B8;">ur. 35</span>
      </div>
      <p style="margin: 11px 0 12px; font-size: 15px; font-weight: 650; line-height: 1.4; text-wrap: pretty;">Nibura ikinyabiziga gitegetswe kugira uduhanagurakirahure tungahe?</p>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span class="opt" style="background: #E9F4EE; border: 1.5px solid #0B7A4B;">
          <span class="ltr" style="background: #0B7A4B; color: #FFFFFF;">C</span>
          <span style="flex-grow: 1; font-weight: 600;">1</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.6 4.4 4.4L19 7.4" stroke="#0B7A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
      </div>
    </div>

    <!-- unanswered item -->
    <div style="background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 16px; padding: 15px 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge" style="background: #EDEAE2; color: #5C6A72;">Ikibazo 5</span>
        <span class="badge" style="background: #EDEAE2; color: #8D9AA2;">Ntiwasubije</span>
        <span style="margin-left: auto; font-size: 11px; color: #A8B2B8;">ur. 58</span>
      </div>
      <p style="margin: 11px 0 0; font-size: 15px; font-weight: 650; line-height: 1.4; text-wrap: pretty;">Amatara maremare agomba kuzimwa ryari?</p>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
