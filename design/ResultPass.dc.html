<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #0B7A4B; text-decoration: none; } a:hover { color: #085B38; }
    .num { font-family: "Space Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F4EF; color: #10161A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- verdict -->
  <div style="background: #0B7A4B; color: #FFFFFF; padding: 42px 24px 30px; display: flex; flex-direction: column; align-items: center; gap: 7px; border-radius: 0 0 26px 26px;">
    <span style="display: flex; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.18); align-items: center; justify-content: center; margin-bottom: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 12.6 4.4 4.4L19 7.4" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
    <span class="num" style="font-size: 62px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;">16<span style="font-size: 25px; opacity: 0.7;">/20</span></span>
    <span class="num" style="font-size: 21px; font-weight: 700; letter-spacing: -0.015em;">Watsinze!</span>
    <span style="font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,0.8); text-align: center; max-width: 30ch;">Warenze amanota yo gutsinda (12/20). Komeza gutyo.</span>
  </div>

  <!-- stats -->
  <div style="margin: 16px 20px 0; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 18px; padding: 16px 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span class="num" style="font-size: 21px; font-weight: 700; color: #0B7A4B;">16</span>
      <span style="font-size: 11px; color: #8D9AA2;">Byiza</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span class="num" style="font-size: 21px; font-weight: 700; color: #B8302B;">3</span>
      <span style="font-size: 11px; color: #8D9AA2;">Bibi</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span class="num" style="font-size: 21px; font-weight: 700; color: #8D9AA2;">1</span>
      <span style="font-size: 11px; color: #8D9AA2;">Utasubije</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span class="num" style="font-size: 21px; font-weight: 700;">12:38</span>
      <span style="font-size: 11px; color: #8D9AA2;">Igihe</span>
    </div>
  </div>

  <!-- breakdown -->
  <div style="margin: 12px 20px 0; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 18px; padding: 16px 18px;">
    <span style="font-size: 11.5px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: #8D9AA2;">Uko wagenze</span>
    <div style="display: flex; flex-direction: column; gap: 13px; margin-top: 14px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="width: 78px; flex: none; font-size: 13.5px; color: #5C6A72;">Ibyapa</span>
        <span style="flex-grow: 1; height: 8px; border-radius: 5px; background: #EDEAE2; overflow: hidden;">
          <span style="display: block; width: 78%; height: 100%; border-radius: 5px; background: #0B7A4B;"></span>
        </span>
        <span class="num" style="width: 38px; flex: none; text-align: right; font-size: 13.5px; font-weight: 700;">7/9</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="width: 78px; flex: none; font-size: 13.5px; color: #5C6A72;">Amategeko</span>
        <span style="flex-grow: 1; height: 8px; border-radius: 5px; background: #EDEAE2; overflow: hidden;">
          <span style="display: block; width: 82%; height: 100%; border-radius: 5px; background: #0B7A4B;"></span>
        </span>
        <span class="num" style="width: 38px; flex: none; text-align: right; font-size: 13.5px; font-weight: 700;">9/11</span>
      </div>
    </div>
  </div>

  <!-- actions -->
  <div style="margin-top: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 9px;">
    <span class="num" style="display: flex; min-height: 52px; align-items: center; justify-content: center; gap: 8px; background: #10161A; border-radius: 14px; font-size: 15.5px; font-weight: 700; color: #FFFFFF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12Z" stroke="#FFFFFF" stroke-width="1.9" stroke-linejoin="round"></path>
        <circle cx="12" cy="12" r="2.8" stroke="#FFFFFF" stroke-width="1.9"></circle>
      </svg>
      Reba ibisubizo
    </span>
    <div style="display: flex; gap: 9px;">
      <span style="display: flex; flex-grow: 1; min-height: 48px; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 14px; font-size: 14px; font-weight: 600;">Ongera</span>
      <span style="display: flex; flex-grow: 1; min-height: 48px; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 14px; font-size: 14px; font-weight: 600;">Ahabanza</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
