<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #0B7A4B; text-decoration: none; } a:hover { color: #085B38; }
    .num { font-family: "Space Grotesk", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F4EF; color: #10161A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- command bar -->
  <div style="background: #10161A; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px;">
      <span style="display: flex; width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.10); align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke="#F6F4EF" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span class="num" style="font-size: 12.5px; font-weight: 500; color: rgba(246,244,239,0.62);">IKIBAZO <span style="color: #F6F4EF; font-weight: 700;">7</span> / 20</span>
          <span style="font-size: 11.5px; color: rgba(246,244,239,0.45);">6 utarasubiza</span>
        </div>
        <div style="height: 4px; border-radius: 3px; background: rgba(255,255,255,0.16); overflow: hidden;">
          <span style="display: block; width: 35%; height: 100%; border-radius: 3px; background: #2FBF7E;"></span>
        </div>
      </div>
      <span class="num" style="font-size: 19px; font-weight: 700; color: #F6F4EF; background: rgba(255,255,255,0.10); border-radius: 10px; padding: 6px 11px; letter-spacing: -0.01em;">14:32</span>
    </div>
  </div>

  <!-- question -->
  <div style="flex-grow: 1; padding: 20px 20px 0; display: flex; flex-direction: column;">
    <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px; background: #EDEAE2; color: #5C6A72; font-size: 11px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;">Icyapa</span>

    <p style="margin: 12px 0 0; font-size: 18px; font-weight: 650; line-height: 1.42; letter-spacing: -0.008em; text-wrap: pretty;">Iki cyapa gisobanura iki?</p>

    <div style="display: flex; justify-content: center; margin: 14px 0 4px;">
      <img src="sign-twoway.png" alt="Icyapa cy'umuhanda" style="display: block; height: 116px; width: auto; background: #FFFFFF; border: 1px solid #E3DFD6; border-radius: 14px; padding: 9px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px; margin-top: 14px;">

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #E3DFD6; border-radius: 14px; padding: 13px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 30px; height: 30px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1.5px solid #E3DFD6; color: #5C6A72; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700;">A</span>
        <span style="font-size: 15px; line-height: 1.35;">Umuhanda ugana ibumoso</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #E9F4EE; border: 1.5px solid #0B7A4B; border-radius: 14px; padding: 13px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 30px; height: 30px; flex: none; border-radius: 50%; background: #0B7A4B; border: 1.5px solid #0B7A4B; color: #FFFFFF; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700;">B</span>
        <span style="font-size: 15px; line-height: 1.35; font-weight: 600;">Umuhanda w'ibyerekezo byombi</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #E3DFD6; border-radius: 14px; padding: 13px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 30px; height: 30px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1.5px solid #E3DFD6; color: #5C6A72; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700;">C</span>
        <span style="font-size: 15px; line-height: 1.35;">Birabujijwe kunyuranaho</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #E3DFD6; border-radius: 14px; padding: 13px 14px; min-height: 46px;">
        <span class="num" style="display: flex; width: 30px; height: 30px; flex: none; border-radius: 50%; background: #F2F0EA; border: 1.5px solid #E3DFD6; color: #5C6A72; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700;">D</span>
        <span style="font-size: 15px; line-height: 1.35;">Nta gisubizo cy'ukuri kirimo</span>
      </div>

    </div>

    <span style="margin-top: 14px; font-size: 11.5px; color: #A8B2B8;">Igitabo — urupapuro 92</span>
  </div>

  <!-- footer -->
  <div style="display: flex; gap: 8px; padding: 10px 14px 20px; background: #FFFFFF; border-top: 1px solid #E3DFD6;">
    <span style="display: flex; flex-grow: 1; min-height: 46px; align-items: center; justify-content: center; border: 1px solid #E3DFD6; border-radius: 12px; font-size: 13.5px; font-weight: 600; color: #8D9AA2;">Inyuma</span>
    <span style="display: flex; flex-grow: 1; min-height: 46px; align-items: center; justify-content: center; border: 1px solid #E3DFD6; border-radius: 12px; font-size: 13.5px; font-weight: 600;">Ibibazo</span>
    <span style="display: flex; flex-grow: 1; min-height: 46px; align-items: center; justify-content: center; gap: 5px; border: 1px solid #E7C88A; background: #FBF0DC; border-radius: 12px; font-size: 13.5px; font-weight: 600; color: #8A5A0F;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 3.2v17.6M6 4.4h11.6l-2.4 3.8 2.4 3.8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Menya
    </span>
    <span class="num" style="display: flex; flex-grow: 1.5; min-height: 46px; align-items: center; justify-content: center; gap: 5px; background: #0B7A4B; border-radius: 12px; font-size: 14px; font-weight: 700; color: #FFFFFF;">
      Komeza
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h13M12.5 6l6 6-6 6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
  </div>

</div>
</x-dc>
</body>
</html>
